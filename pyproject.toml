[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-e18e-codemods"
version = "0.1.0"
description = "Reviewable Python library and syntax migrations"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["libcst>=1.8,<2", "ruff>=0.16.9,<0.17"]

[project.scripts]
python-e18e-codemod = "python_e18e_codemods.__main__:main"

[project.urls]
Repository = "https://github.com/python-e18e/codemods"
Issues = "https://github.com/python-e18e/codemods/issues"

[tool.setuptools.packages.find]
include = ["python_e18e_codemods*"]
